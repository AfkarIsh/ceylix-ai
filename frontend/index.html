<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO & Social Meta ────────────────────────────────────────── -->
    <title>Ceylix AI — Evidence-Grounded Risk Investigation Workbench</title>
    <meta name="description" content="Enterprise BFSI AI workbench for deterministic transaction risk investigation. Powered by Gemini 2.5 Flash and Pro with evidence-grounded claim validation and adversarial injection defence." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#020617" />

    <!-- Open Graph -->
    <meta property="og:title"       content="Ceylix AI — Risk Investigation Workbench" />
    <meta property="og:description" content="BFSI-grade AI transaction risk investigation with deterministic claim validation." />
    <meta property="og:type"        content="website" />

    <!-- ── Favicon (inline SVG shield) ─────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2306b6d4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10'/><path d='m9 12 2 2 4-4'/></svg>" />

    <!-- ── Google Fonts ──────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ── Tailwind CSS (CDN v3 — zero build step) ───────────────────── -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                950: '#020617',
                900: '#0f172a',
                850: '#111c35',
                800: '#1e293b',
                700: '#334155',
              }
            },
            fontFamily: {
              sans: [
                'Inter', 'system-ui', '-apple-system',
                'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'
              ],
              mono: [
                'JetBrains Mono', 'Fira Code', 'ui-monospace',
                'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'
              ]
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

</html>
